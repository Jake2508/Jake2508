name: Update GitHub Stats

on:
  schedule:
     - cron: "0 3 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          # Dark-theme card, re-themed to match the green README hero. Transparent bg
          # (bg_color=00000000) so it sits on GitHub's dark background.
          options: username=Jake2508&show_icons=true&border_radius=12&hide_title=false&title_color=3fb950&icon_color=3fb950&text_color=6e7681&bg_color=00000000&ring_color=3fb950&border_color=30363d&count_private=true
          path: assets/github-stats.svg
          # Stats card needs account-wide data (rank, totals, private contributions),
          # which the repo-scoped GITHUB_TOKEN cannot access ("Resource not accessible
          # by integration"). A Personal Access Token is required here.
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate stats card (light)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          # Light-theme twin of the card above, using the same palette as the
          # *-light.svg header and headings (green 1f7a33, muted text 59636e) plus
          # GitHub's light border colour (d1d9e0). The dark green 3fb950 is only
          # 2.5:1 contrast on white; 1f7a33 is 5.4:1.
          options: username=Jake2508&show_icons=true&border_radius=12&hide_title=false&title_color=1f7a33&icon_color=1f7a33&text_color=59636e&bg_color=00000000&ring_color=1f7a33&border_color=d1d9e0&count_private=true
          path: assets/github-stats-light.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          # card_width widens this card so that, at the shared display height
          # (height=175 in the README), its width lines up with the stats card
          # for an even, matched pair.
          options: username=Jake2508&layout=compact&border_radius=12&title_color=3fb950&text_color=6e7681&bg_color=00000000&border_color=30363d&card_width=395
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate languages card (light)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          # Light-theme twin of the languages card, same palette as the light stats card.
          options: username=Jake2508&layout=compact&border_radius=12&title_color=1f7a33&text_color=59636e&bg_color=00000000&border_color=d1d9e0&card_width=395
          path: assets/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-langs.svg assets/github-stats-light.svg assets/top-langs-light.svg
          git commit -m "Update stats" || exit 0
          git push
